name: One-off Fortran archived-corpus accounting

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate and archived source objects
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Materialize separately pinned independent oracle
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/ai-ci
          ref: f26b6c42de8a75bc9d2e6be4956e41966771eacc
          path: _ai_ci
          persist-credentials: false
      - name: Reproduce complete source-only tables
        run: node examples/autogenerated/fortran-coverage/audit.mjs --check
      - name: Independently check original bytes and reject targeted corruptions
        run: node _ai_ci/fortran-coverage/check.mjs --repository "$GITHUB_WORKSPACE" --self-test --receipt "$RUNNER_TEMP/fortran-acceptance.tsv"
      - name: Reproduce linked ARM English ledgers
        run: node examples/autogenerated/arm-linked-ledgers/generate.mjs --check
      - name: Independently check linked ledgers and reject targeted corruptions
        run: node _ai_ci/fortran-coverage/check-arm-ledgers.mjs --repository "$GITHUB_WORKSPACE" --self-test --receipt "$RUNNER_TEMP/arm-ledger-acceptance.tsv"
      - name: Retain exact-head structural receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fortran-structural-acceptance-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/fortran-acceptance.tsv
            ${{ runner.temp }}/arm-ledger-acceptance.tsv
          if-no-files-found: error
